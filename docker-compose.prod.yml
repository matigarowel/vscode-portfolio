services:
  portfolio-app:
    image: matigarowel10/portfolio:app
    container_name: portfolio-app
    env_file:
      - .env.prod
    build:
      context: .
      args:
        NEXT_PUBLIC_GITHUB_USERNAME: matigarowel
    restart: unless-stopped
    ports:
      - "3006:3000"
    networks:
      - backend

networks:
  backend:
    external: true
