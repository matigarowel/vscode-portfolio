name: Hostinger Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_GITHUB_USERNAME=matigarowel
            NEXT_PUBLIC_LANGFLOW_API_KEY=${{ secrets.NEXT_PUBLIC_LANGFLOW_API_KEY }}
            NEXT_PUBLIC_LANGFLOW_ENDPOINT=${{ secrets.NEXT_PUBLIC_LANGFLOW_ENDPOINT }}
            NEXT_PUBLIC_LANGFLOW_FLOW_ID=${{ secrets.NEXT_PUBLIC_LANGFLOW_FLOW_ID }}
          tags: |
            ${{ github.ref_name == 'main' && 'matigarowel10/portfolio:app' || '' }}
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy docker compose
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/deploy/portfolio/portfolio-app/

      - name: Deploy application on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            # Branch-based deployment
            cd ~/deploy/portfolio/portfolio-app/
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            
            echo "Deploying..."
            docker compose -f docker-compose.prod.yml -p portfolio-app pull
            docker compose -f docker-compose.prod.yml -p portfolio-app up -d