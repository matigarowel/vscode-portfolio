services:
  portfolio-app:
    image: matigarowel10/portfolio:app
    container_name: portfolio-app
    build:
      context: .
      args:
        NEXT_PUBLIC_GITHUB_USERNAME: ${NEXT_PUBLIC_GITHUB_USERNAME:?Set NEXT_PUBLIC_GITHUB_USERNAME}
        NEXT_PUBLIC_OPENAI_API_KEY: ${NEXT_PUBLIC_OPENAI_API_KEY:-}
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      DEV_TO_API_KEY: ${DEV_TO_API_KEY:-}
